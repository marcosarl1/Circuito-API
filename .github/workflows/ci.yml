name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Unformatted files:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test with race detector
        run: go test -race ./... -count=1

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true

      - name: Integration flows
        run: go test -tags integration ./tests/integration/ -v -count=1

      - name: Latency and concurrency budgets
        run: go test -tags perf ./tests/performance/ -v -count=1

  docker:
    runs-on: ubuntu-latest
    needs: [verify, integration]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t circuito-api:ci .
